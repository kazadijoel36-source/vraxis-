<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VRAXIS | {% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <!-- Add your font links here -->
</head>
<body>

    <header class="top-header">
        <div class="logo">vraxisdrop</div>
        <a href="{{ url_for('index') }}" class="new-drop-btn">New Drop</a>
    </header>

    <main class="content-wrapper">
        {% block content %}{% endblock %}
        
        <footer class="footer-info">
            <p>ZA-01 NODE · POTCHEFSTROOM · V1.0.4</p>
        </footer>
    </main>

    <nav class="bottom-nav">
        <a href="{{ url_for('index') }}" class="nav-item {{ 'active' if request.endpoint == 'index' }}">
            <img src="{{ url_for('static', filename='icons/drop.png') }}" alt="Drop">
            <span>Drop</span>
        </a>
       <!-- Change 'retrieve' to 'retrieve_page' -->
<a href="{{ url_for('retrieve_page') }}" class="nav-item {{ 'active' if request.endpoint == 'retrieve_page' }}">
    <img src="{{ url_for('static', filename='icons/retrieve.png') }}" alt="Retrieve">
    <span>Retrieve</span>
</a>
        <a href="{{ url_for('activity') }}" class="nav-item {{ 'active' if request.endpoint == 'activity' }}">
            <img src="{{ url_for('static', filename='icons/activity.png') }}" alt="Activity">
            <span>Activity</span>
        </a>
        <a href="{{ url_for('journal') }}" class="nav-item {{ 'active' if request.endpoint == 'journal' }}">
            <img src="{{ url_for('static', filename='icons/journal.png') }}" alt="Journal">
            <span>Journal</span>
        </a>
        
        <div class="nav-item more-trigger" onclick="toggleMenu()">
            <img src="{{ url_for('static', filename='icons/more.png') }}" alt="More">
            <span>More</span>
            <div id="moreMenu" class="more-menu">
                <a href="{{ url_for('about') }}">About Us</a>
                <a href="{{ url_for('privacy') }}">Privacy Policy</a>
                <a href="{{ url_for('terms') }}">Terms & Con</a>
                <hr>
                <p style="font-size: 10px; color: #888; padding: 10px;">POTCHEFSTROOM NODE</p>
            </div>
        </div>
    </nav>

    <script>
        function toggleMenu() {
            const menu = document.getElementById('moreMenu');
            menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
        }
        // Close menu if clicking outside
        window.onclick = function(event) {
            if (!event.target.matches('.more-trigger') && !event.target.closest('.more-trigger')) {
                document.getElementById('moreMenu').style.display = 'none';
            }
        }
    </script>
</body>
</html>
